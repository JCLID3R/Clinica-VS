<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    # Frontend
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Backend: todo lo que empiece con /api/ lo atiende backend/public/index.php
    Alias /api /var/www/backend/public
    <Directory /var/www/backend/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # El resto del backend (app/, tests/, .env) nunca se publica
    <Directory /var/www/backend>
        Require all denied
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
